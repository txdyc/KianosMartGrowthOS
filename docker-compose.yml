services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kiano}
      POSTGRES_USER: ${POSTGRES_USER:-kiano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiano-local}
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    # MinIO community images stopped being published after the 2025-09 release,
    # so the tag is pinned here and in the test suite.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kiano}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kiano-local}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # The app itself only runs with --profile app, so `docker compose up -d`
  # keeps starting just the infrastructure for local dev.
  api:
    profiles: ["app"]
    build: kiano-api
    env_file: .env
    environment:
      # Inside the compose network the services talk to each other; only the
      # browser-facing public endpoint stays on localhost.
      KIANO_DB_URL: jdbc:postgresql://postgres:5432/kiano?stringtype=unspecified
      KIANO_STORAGE_ENDPOINT: http://minio:9000
      # SHA-256 hex of the native worker's token. The plain token stays in .env
      # and is only read by scripts/run-worker.ps1 on the host.
      KIANO_WORKER_TOKEN_SHA256: ${KIANO_WORKER_TOKEN_SHA256:-}
      # Claude API key for the LLM gateway (C3); passed through from .env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - minio

  web:
    profiles: ["app"]
    build:
      context: kiano-web
      args:
        # The browser runs on the host, so it reaches the API via the mapped port.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pg_data:
  minio_data:
