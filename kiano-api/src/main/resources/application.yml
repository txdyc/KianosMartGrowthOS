spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: "${KIANO_DB_URL}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: 8081

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

kiano:
  security:
    jwt-secret: "${KIANO_JWT_SECRET}"
    crypto-key: "${KIANO_CRYPTO_KEY}"
    cookie-secure: "${KIANO_COOKIE_SECURE:false}"
    token-ttl: 12h
  bootstrap:
    owner-email: "${KIANO_BOOTSTRAP_OWNER_EMAIL:}"
    owner-password: "${KIANO_BOOTSTRAP_OWNER_PASSWORD:}"
  web:
    origin: "${KIANO_WEB_ORIGIN:http://localhost:3000}"
  storage:
    endpoint: "${KIANO_STORAGE_ENDPOINT}"
    public-endpoint: "${KIANO_STORAGE_PUBLIC_ENDPOINT}"
    bucket: "${KIANO_STORAGE_BUCKET:kiano}"
    access-key: "${MINIO_ROOT_USER}"
    secret-key: "${MINIO_ROOT_PASSWORD}"
    region: us-east-1
  queue:
    enabled: true
    poll-interval: 2s
    lease: 15m
  commerce:
    sync-cron: "0 0 * * * *"
  media:
    ffprobe-path: "${KIANO_FFPROBE_PATH:ffprobe}"
  content:
    qc:
      photo:
        min-short-side: 2000
        analysis-long-side: 1024
        blur-min-variance: 60
        clip-high: 250
        clip-low: 5
        max-over-ratio: 0.30
        max-under-ratio: 0.30
      video:
        min-short-side: 1080
        fps-min: 29.0
        fps-max: 31.0
        v1-min-seconds: 10
        v1-max-seconds: 20
