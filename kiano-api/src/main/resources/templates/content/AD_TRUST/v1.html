<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Noto Sans', sans-serif; }
  .canvas { position:relative; overflow:hidden; width:{{width}}px; height:{{height}}px; --fs:{{fontScale}}; }
  .bg { position:absolute; top:-5%; left:-5%; width:110%; height:110%; object-fit:cover; filter:blur(40px); }
  .product { position:absolute; object-fit:contain; }
  .ad-text { font-family:'Noto Sans', sans-serif; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.55); }
  .overlay { font-weight:700; }
  .badge-row { display:flex; justify-content:center; gap:18px; flex-wrap:wrap; }
  .badge { display:inline-block; padding:8px 20px; border-radius:999px; background:rgba(0,0,0,.55); font-size:calc(22px*var(--fs)); font-weight:700; }
  .canvas.s1x1 .bg { filter:none; }
  .canvas.s1x1 .product { inset:0; width:100%; height:100%; }
  .canvas.s1x1 .bar { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.45); padding:30px 60px 40px; text-align:center; }
  .canvas.s1x1 .overlay { font-size:calc(30px*var(--fs)); }
  .canvas.s1x1 .name { font-size:calc(22px*var(--fs)); margin:8px 0 14px; }
  .canvas.s4x5 .product { top:80px; left:0; right:0; bottom:330px; margin:0 auto; max-width:100%; max-height:100%; }
  .canvas.s4x5 .overlay { position:absolute; left:0; right:0; bottom:290px; text-align:center; font-size:calc(30px*var(--fs)); }
  .canvas.s4x5 .name { position:absolute; left:0; right:0; bottom:220px; text-align:center; font-size:calc(22px*var(--fs)); }
  .canvas.s4x5 .badge-row { position:absolute; left:0; right:0; bottom:110px; }
  .canvas.s9x16 .product { top:500px; left:0; right:0; bottom:800px; margin:0 auto; max-width:100%; max-height:100%; }
  .canvas.s9x16 .overlay { position:absolute; left:0; right:0; top:290px; text-align:center; font-size:calc(34px*var(--fs)); padding:0 60px; }
  .canvas.s9x16 .name { position:absolute; left:0; right:0; top:390px; text-align:center; font-size:calc(24px*var(--fs)); }
  .canvas.s9x16 .badge-row { position:absolute; left:0; right:0; top:1120px; }
</style></head><body>
  <div class="canvas {{sizeClass}}">
    <img class="bg" src="{{baseImage}}" alt="">
    <img class="product" src="{{baseImage}}" alt="">
    <div class="bar">
      <div class="ad-text overlay">{{overlay}}</div>
      <div class="ad-text name">{{productName}}</div>
      <div class="badge-row">
        {{#badges}}<span class="ad-text badge">{{text}}</span>{{/badges}}
      </div>
    </div>
  </div>
</body></html>
