<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 1600px; background: #ffffff; overflow: hidden;
    font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; color: #16212b;
    padding: 90px 120px; box-sizing: border-box;
  }
  h1 { font-size: 58px; line-height: 1.15; font-weight: 700; margin: 0 0 48px;
       overflow-wrap: anywhere; }
  img {
    display: block; width: 1000px; max-width: 100%; height: 760px;
    object-fit: contain; margin: 0 auto 56px; background: #ffffff;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    font-size: 38px; line-height: 1.35; padding: 22px 0 22px 56px;
    position: relative; border-bottom: 2px solid #e3e8ee; overflow-wrap: anywhere;
  }
  li::before {
    content: ""; position: absolute; left: 8px; top: 40px;
    width: 18px; height: 18px; border-radius: 50%; background: #0f8a65;
  }
</style>
</head>
<body>
  <h1>{{productName}}</h1>
  <img alt="{{productName}}" src="data:image/png;base64,{{productImage}}">
  <ul>
    {{#benefits}}<li>{{.}}</li>{{/benefits}}
  </ul>
</body>
</html>
